name: Update docs and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1' # Mondays, 06:23 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch the latest official API documentation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: telegram-docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install conversion dependencies
        run: python -m pip install -r requirements.txt
      - name: Test conversion and links
        run: python -m unittest discover -s tests -v
      - name: Fetch and convert official HTML
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python update_docs.py
      - name: Rebuild Markdown documentation
        run: python build_llms.py tg-docs.md --output llms-docs --force
      - name: Assemble static website
        run: python build_site.py
      - name: Commit refreshed documentation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tg-docs.md llms-docs
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Telegram Bot API snapshot"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
