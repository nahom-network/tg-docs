name: Update docs and deploy Pages

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '23 6 * * 1' # Mondays, 06:23 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch the latest official API and Serverless documentation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: telegram-docs-pages
  cancel-in-progress: false

jobs:
  build:
    # The publish step commits generated files. Skip the run that commit
    # triggers so the workflow does not loop; Pages still rebuilds the branch.
    if: github.event_name != 'push' || github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      # Check out the ref that triggered the run. Pinning a branch name here
      # breaks when the repository's default branch is renamed.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install conversion dependencies
        run: python -m pip install -r requirements.txt
      - name: Test conversion and links
        run: python -m unittest discover -s tests -v
      - name: Fetch and convert official documentation
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python update_docs.py
      - name: Read deployed Pages URL
        uses: actions/configure-pages@v5
        id: pages
      # Pages currently publishes the main branch root (legacy build_type), so
      # the site and its llms.txt must live in the root, not only in _site.
      - name: Publish site to the branch root
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: python build_site.py --output .
      # Keep producing the artifact too, so switching Pages to GitHub Actions
      # later works without another workflow change.
      - name: Assemble Pages artifact
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: python build_site.py --output _site
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tg-docs.md serverless-docs.md external-docs assets \
            sections external serverless llms.txt llms-full.txt \
            index.html serverless.html docs.json robots.txt .nojekyll \
            .site-manifest.json
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if ! git diff --cached --quiet; then
            git commit -m "docs: rebuild Telegram docs site"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
